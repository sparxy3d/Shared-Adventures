# Deterministic gate: install, typecheck, build, migration immutability. No secrets, no database.
# Runs on every PR and on every push to main (Replit Agent commits straight to main).
name: PR guards

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Applied migrations are immutable (ADR 013). Any edit, rename or deletion of an
      # existing file in migrations/ fails here; the server would also refuse to start.
      - name: Applied migrations are unchanged
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No comparable base commit; skipping."; exit 0
          fi
          CHANGED=$(git diff --name-status "$BASE_SHA" HEAD -- migrations/ | grep -E '^(M|D|R)' || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::Existing migration files must never be edited, renamed or deleted. Add a new numbered file instead."
            echo "$CHANGED"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json has three entries resolved to Replit's internal registry
      # (package-firewall.replit.local), which does not exist outside Replit.
      # Point them at the public registry. Remove this step once the lockfile is fixed.
      # See docs/context/tech.md, "Lockfile trap".
      - name: Rewrite Replit-only lockfile URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#' package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
